<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Speed Cube</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b2b2b 0%, #1a1a1a 100%);
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlay */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background: white;
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        button.accent {
            background: #00d2ff;
            border-color: #00d2ff;
            color: #000;
        }
        
        button.accent:hover {
            background: #57e0ff;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            user-select: none;
            max-width: 250px;
        }
        .instructions h1 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .instructions p { margin: 0 0 5px 0; font-size: 0.85rem; opacity: 0.8; }
        .key-hint {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: monospace;
            margin-right: 4px;
        }

        /* History Panel */
        .history-panel {
            position: absolute;
            top: 160px; /* Below instructions */
            left: 20px;
            width: 180px;
            max-height: 300px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            pointer-events: auto; /* Allow scrolling */
        }
        .history-header {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #00d2ff;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-content: flex-start;
            padding-right: 5px;
        }
        /* Custom Scrollbar */
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }
        
        .move-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-family: monospace;
            font-weight: bold;
            color: white;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Virtual Keypad for touch/mouse users */
        .virtual-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        .v-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .v-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .v-label {
            grid-column: span 2;
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        
        /* Loading Overlay */
        #loading {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <div class="instructions">
        <h1>Speed Cube</h1>
        <p>Drag background to rotate view.</p>
        <p><span class="key-hint">Keyboard</span> U D L R F B</p>
        <p><span class="key-hint">Shift+Key</span> for counter-clockwise</p>
    </div>

    <div class="history-panel">
        <div class="history-header">Move History</div>
        <div class="history-list" id="history-list">
            <!-- Moves will appear here -->
        </div>
    </div>

    <!-- Virtual Controls for ease of use -->
    <div class="virtual-controls">
        <div class="v-label">Face Controls</div>
        <div class="v-btn" onclick="window.rotateLayer('y', 1, -1)" title="Up">U</div>
        <div class="v-btn" onclick="window.rotateLayer('y', 1, 1)" title="Up Prime">U'</div>
        <div class="v-btn" onclick="window.rotateLayer('y', -1, 1)" title="Down">D</div>
        <div class="v-btn" onclick="window.rotateLayer('y', -1, -1)" title="Down Prime">D'</div>
        <div class="v-btn" onclick="window.rotateLayer('x', -1, 1)" title="Left">L</div>
        <div class="v-btn" onclick="window.rotateLayer('x', -1, -1)" title="Left Prime">L'</div>
        <div class="v-btn" onclick="window.rotateLayer('x', 1, -1)" title="Right">R</div>
        <div class="v-btn" onclick="window.rotateLayer('x', 1, 1)" title="Right Prime">R'</div>
        <div class="v-btn" onclick="window.rotateLayer('z', 1, -1)" title="Front">F</div>
        <div class="v-btn" onclick="window.rotateLayer('z', 1, 1)" title="Front Prime">F'</div>
        <div class="v-btn" onclick="window.rotateLayer('z', -1, 1)" title="Back">B</div>
        <div class="v-btn" onclick="window.rotateLayer('z', -1, -1)" title="Back Prime">B'</div>
    </div>

    <div class="ui-container">
        <button onclick="scrambleCube()">Scramble</button>
        <button class="accent" onclick="resetCube()">Reset</button>
    </div>

    <div id="canvas-container"></div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- Configuration ---
        const CUBE_SIZE = 1;
        const SPACING = 0.02; // Gap between cubies
        const ANIMATION_SPEED = 0.15; 

        // Speed Cube Colors (Standard Scheme)
        const COLORS = {
            CORE: 0x111111 // Black plastic
        };
        
        const FACE_COLORS = {
            Right: 0xb71234, // Red
            Left: 0xff5800,  // Orange
            Up: 0xffffff,    // White
            Down: 0xffd500,  // Yellow
            Front: 0x009b48, // Green
            Back: 0x0046ad   // Blue
        };

        // --- State ---
        let scene, camera, renderer, controls;
        let allCubies = [];
        let isAnimating = false;
        let pivotGroup; // Helper group for rotation

        init();
        animate();

        function init() {
            // 1. Setup Scene
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(6, 5, 8);
            
            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Controls (Orbit)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 20;

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
            backLight.position.set(-10, -10, -10);
            scene.add(backLight);

            // 6. Create Cube
            pivotGroup = new THREE.Group();
            scene.add(pivotGroup);
            createRubiksCube();

            // 7. Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);

            // Remove loading
            setTimeout(() => {
                const loader = document.getElementById('loading');
                loader.style.opacity = 0;
                setTimeout(() => loader.remove(), 500);
            }, 500);
        }

        function createRubiksCube() {
            // Clear existing
            allCubies.forEach(c => scene.remove(c));
            allCubies = [];

            // Geometry for a single cubie
            const geometry = new RoundedBoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE, 4, 0.1);

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        
                        // Create materials
                        // Order: Right, Left, Top, Bottom, Front, Back
                        const materials = [
                            new THREE.MeshStandardMaterial({ color: x === 1 ? FACE_COLORS.Right : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: x === -1 ? FACE_COLORS.Left : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: y === 1 ? FACE_COLORS.Up : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: y === -1 ? FACE_COLORS.Down : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: z === 1 ? FACE_COLORS.Front : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                            new THREE.MeshStandardMaterial({ color: z === -1 ? FACE_COLORS.Back : COLORS.CORE, roughness: 0.2, metalness: 0.1 }), 
                        ];

                        const cubie = new THREE.Mesh(geometry, materials);
                        
                        // Position with spacing
                        cubie.position.set(
                            x * (CUBE_SIZE + SPACING),
                            y * (CUBE_SIZE + SPACING),
                            z * (CUBE_SIZE + SPACING)
                        );

                        cubie.userData = { x, y, z }; // Store logical initial position
                        cubie.castShadow = true;
                        cubie.receiveShadow = true;

                        allCubies.push(cubie);
                        scene.add(cubie);
                    }
                }
            }
        }

        // --- History & Notation Logic ---

        function getNotation(axis, layer, dir) {
            // Convert axis/layer/dir to standard notation
            // Mapping based on our rotateLayer logic
            if (axis === 'y' && layer === 1) return dir === -1 ? "U" : "U'";
            if (axis === 'y' && layer === -1) return dir === 1 ? "D" : "D'";
            if (axis === 'x' && layer === -1) return dir === 1 ? "L" : "L'";
            if (axis === 'x' && layer === 1) return dir === -1 ? "R" : "R'";
            if (axis === 'z' && layer === 1) return dir === -1 ? "F" : "F'";
            if (axis === 'z' && layer === -1) return dir === 1 ? "B" : "B'";
            return "?";
        }

        function logMove(notation) {
            const list = document.getElementById('history-list');
            const badge = document.createElement('div');
            badge.className = 'move-badge';
            badge.innerText = notation;
            list.appendChild(badge);
            // Auto scroll to bottom
            list.scrollTop = list.scrollHeight;
        }

        // --- Rotation Logic ---

        function getCubiesOnAxis(axis, value) {
            const epsilon = 0.1;
            const positionValue = value * (CUBE_SIZE + SPACING);
            
            return allCubies.filter(cubie => {
                const worldPos = new THREE.Vector3();
                cubie.getWorldPosition(worldPos);
                return Math.abs(worldPos[axis] - positionValue) < epsilon;
            });
        }

        // Exposed globally
        window.rotateLayer = function(axis, layerValue, direction, duration = 300) {
            if (isAnimating) return;
            isAnimating = true;

            // Log the move
            const notation = getNotation(axis, layerValue, direction);
            logMove(notation);

            const targetCubies = getCubiesOnAxis(axis, layerValue);
            
            // Reset pivot transform
            pivotGroup.rotation.set(0, 0, 0);
            pivotGroup.position.set(0, 0, 0);
            pivotGroup.updateMatrixWorld();
            
            // Attach cubies
            targetCubies.forEach(cubie => {
                pivotGroup.attach(cubie);
            });

            // Animate
            const targetAngle = (Math.PI / 2) * direction; // 90 degrees
            const axisVector = new THREE.Vector3();
            axisVector[axis] = 1;

            let startTime = null;

            function animateRotation(time) {
                if (!startTime) startTime = time;
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing
                const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                const currentAngle = THREE.MathUtils.lerp(0, targetAngle, ease);
                pivotGroup.setRotationFromAxisAngle(axisVector, currentAngle);
                pivotGroup.updateMatrixWorld();

                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    // Finish animation
                    const children = [...pivotGroup.children];
                    children.forEach(c => {
                        scene.attach(c);
                        // Snap to grid
                        c.position.x = Math.round(c.position.x / (CUBE_SIZE + SPACING)) * (CUBE_SIZE + SPACING);
                        c.position.y = Math.round(c.position.y / (CUBE_SIZE + SPACING)) * (CUBE_SIZE + SPACING);
                        c.position.z = Math.round(c.position.z / (CUBE_SIZE + SPACING)) * (CUBE_SIZE + SPACING);
                        
                        const euler = new THREE.Euler().setFromQuaternion(c.quaternion);
                        c.rotation.x = Math.round(euler.x / (Math.PI/2)) * (Math.PI/2);
                        c.rotation.y = Math.round(euler.y / (Math.PI/2)) * (Math.PI/2);
                        c.rotation.z = Math.round(euler.z / (Math.PI/2)) * (Math.PI/2);
                        
                        c.updateMatrix();
                    });
                    
                    isAnimating = false;
                }
            }
            requestAnimationFrame(animateRotation);
        };

        // --- Inputs ---

        function onKeyDown(event) {
            const key = event.key.toUpperCase();
            const shift = event.shiftKey; 
            const dir = shift ? 1 : -1; 
            
            switch(key) {
                case 'U': window.rotateLayer('y', 1, -1 * (shift ? -1 : 1)); break; 
                case 'D': window.rotateLayer('y', -1, 1 * (shift ? -1 : 1)); break; 
                case 'L': window.rotateLayer('x', -1, 1 * (shift ? -1 : 1)); break; 
                case 'R': window.rotateLayer('x', 1, -1 * (shift ? -1 : 1)); break; 
                case 'F': window.rotateLayer('z', 1, -1 * (shift ? -1 : 1)); break; 
                case 'B': window.rotateLayer('z', -1, 1 * (shift ? -1 : 1)); break; 
            }
        }

        window.scrambleCube = function() {
            if(isAnimating) return;
            
            const axes = ['x', 'y', 'z'];
            const layers = [-1, 1];
            const dirs = [1, -1];
            
            let moves = 0;
            const maxMoves = 20;
            
            function nextMove() {
                if(moves >= maxMoves) return;
                
                const axis = axes[Math.floor(Math.random() * axes.length)];
                const layer = layers[Math.floor(Math.random() * layers.length)];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                
                window.rotateLayer(axis, layer, dir, 100);
                moves++;
                
                setTimeout(nextMove, 110);
            }
            nextMove();
        };

        window.resetCube = function() {
           // Clear History
           document.getElementById('history-list').innerHTML = '';
           createRubiksCube();
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
